name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  export_android:
    name: Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools 34
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Android Debug Keystore
        run: |
          mkdir -p ~/.android build/
          if [ ! -f debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Godot 4.3 & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable/ ~/godot/ ~/templates/
          curl -sSL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip -d ~/godot/
          mv ~/godot/Godot_v4.3-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          sudo ln -s ~/godot/godot /usr/local/bin/godot
          
          curl -sSL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o templates.tpz
          unzip -q templates.tpz -d ~/templates/
          mv ~/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^[ \t]*//' ~/.config/godot/editor_settings-4.tres
          sed -i "s|\$ANDROID_HOME|$ANDROID_HOME|g" ~/.config/godot/editor_settings-4.tres
          sed -i "s|\$JAVA_HOME|$JAVA_HOME|g" ~/.config/godot/editor_settings-4.tres
          sed -i "s|\$HOME|$HOME|g" ~/.config/godot/editor_settings-4.tres
          cat ~/.config/godot/editor_settings-4.tres

      - name: Import Godot Project
        run: godot --headless --editor --quit || true

      - name: Export Android APK
        run: godot -v --headless --export-debug "Android" build/Firefight.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firefight-Android-APK
          path: build/Firefight.apk
          retention-days: 30

      - name: Create GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Firefight.apk
          generate_release_notes: true
