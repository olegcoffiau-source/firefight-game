name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  export_android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android Keystore & Templates
        run: |
          mkdir -p /root/.android "$HOME/.android"
          if [ ! -f debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          cp debug.keystore /root/.android/debug.keystore || true
          cp debug.keystore "$HOME/.android/debug.keystore" || true
          
          # Copy export templates to all possible locations including $HOME (/github/home)
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable/"
          mkdir -p "$HOME/.local/share/godot/templates/4.3.stable/"
          mkdir -p /root/.local/share/godot/export_templates/4.3.stable/
          mkdir -p /root/.local/share/godot/templates/4.3.stable/
          
          for d in /root/.local/share/godot/templates/4.3.stable /root/.local/share/godot/export_templates/4.3.stable /usr/local/share/godot/templates/4.3.stable; do
            if [ -d "$d" ]; then
              cp -rn "$d"/* "$HOME/.local/share/godot/export_templates/4.3.stable/" 2>/dev/null || true
              cp -rn "$d"/* "$HOME/.local/share/godot/templates/4.3.stable/" 2>/dev/null || true
              cp -rn "$d"/* /root/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true
            fi
          done

          # Setup Godot Editor Settings for Android SDK & Java SDK
          mkdir -p "$HOME/.config/godot/"
          mkdir -p /root/.config/godot/

          JAVA_BIN=$(which java 2>/dev/null || echo "/usr/bin/java")
          JAVA_REAL=$(readlink -f "$JAVA_BIN" 2>/dev/null || echo "$JAVA_BIN")
          JAVA_HOME_DIR=$(dirname $(dirname "$JAVA_REAL"))
          ANDROID_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android/sdk}}"

          cat << EOF > "$HOME/.config/godot/editor_settings-4.tres"
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_PATH"
export/android/java_sdk_path = "$JAVA_HOME_DIR"
export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

          cp "$HOME/.config/godot/editor_settings-4.tres" /root/.config/godot/editor_settings-4.tres || true

      - name: Create Build Directory
        run: |
          mkdir -p build/

      - name: Export APK with Godot
        run: |
          godot -v --headless --export-debug "Android" build/Firefight.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firefight-Android-APK
          path: build/Firefight.apk
          retention-days: 30

      - name: Create GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Firefight.apk
          generate_release_notes: true
